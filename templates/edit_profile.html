
{% extends "base.html" %}

{% block title %}Edit Profile | CampusConnect{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card profile-edit-card">

        <div class="auth-heading">
            <div class="auth-icon">
                <i class="bi bi-pencil-square"></i>
            </div>

            <h1>Edit Your Profile</h1>
            <p>Tell your campus community more about yourself.</p>
        </div>

        <!-- Frontend preview only: backend integration comes later -->
        <form onsubmit="return false;">

            <div class="mb-3">
                <label class="form-label" for="name">Full Name</label>
                <input class="form-control" id="name"
                       name="name" value="Aarav Sharma">
            </div>

            <div class="mb-3">
                <label class="form-label" for="headline">Headline</label>
                <input class="form-control" id="headline"
                       name="headline"
                       value="Computer Science Student">
            </div>

            <div class="mb-3">
                <label class="form-label" for="skills">Skills</label>
                <input class="form-control" id="skills"
                       name="skills"
                       value="Python, HTML, CSS, Flask">
                <small class="text-muted">
                    Separate skills with commas.
                </small>
            </div>

            <div class="mb-4">
                <label class="form-label" for="bio">About Me</label>
                <textarea class="form-control" id="bio"
                          name="bio" rows="4">Passionate computer science student interested in web development.</textarea>
            </div>

            <button type="button" class="btn btn-primary w-100 py-2"
                    onclick="alert('Profile editing will be enabled after backend integration.')">
                Save Changes
            </button>

            <a href="profile.html"
               class="btn btn-light w-100 mt-2">
                Cancel
            </a>

        </form>

    </div>
</section>

{% endblock %}
