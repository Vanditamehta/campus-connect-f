
{% extends "base.html" %}

{% block title %}Register | CampusConnect{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-card">
        <div class="auth-heading">
            <div class="auth-icon"><i class="bi bi-person-plus"></i></div>
            <h1>Join CampusConnect</h1>
            <p>Create your account and meet your campus community.</p>
        </div>

        <form action="/register" method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Full name</label>
                <input type="text" class="form-control" id="name"
                       name="name" placeholder="Your full name" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email"
                       name="email" placeholder="you@example.com" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password"
                       name="password" minlength="8"
                       placeholder="At least 8 characters" required>
            </div>

            <div class="mb-4">
                <label for="confirm_password" class="form-label">Confirm password</label>
                <input type="password" class="form-control" id="confirm_password"
                       name="confirm_password" minlength="8"
                       placeholder="Enter password again" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2">
                Create Account <i class="bi bi-arrow-right ms-2"></i>
            </button>
        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="/login">Login</a>
        </p>
    </div>
</section>

{% endblock %}
