
{% extends "base.html" %}

{% block title %}Login | CampusConnect{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-card">
        <div class="auth-heading">
            <div class="auth-icon"><i class="bi bi-person-check"></i></div>
            <h1>Welcome back!</h1>
            <p>Sign in to continue your campus journey.</p>
        </div>

        <form action="/login" method="POST">
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email"
                       name="email" placeholder="you@example.com" required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password"
                       name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2">
                Login <i class="bi bi-arrow-right ms-2"></i>
            </button>
        </form>

        <p class="auth-switch">
            Don't have an account?
            <a href="/register">Create one</a>
        </p>
    </div>
</section>

{% endblock %}
